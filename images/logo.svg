<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">OryxOS</title>
  <desc id="description">OryxOS logo with an abstract oryx, an orbital operating-system ring, and connected Agent nodes.</desc>

  <defs>
    <linearGradient id="signal" x1="55" y1="50" x2="250" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.48" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="signal-reverse" x1="235" y1="70" x2="80" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="word-signal" x1="690" y1="92" x2="930" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .wordmark { fill: #172033; }
      .subtitle { fill: #64748b; }
      .head { fill: #172033; }
      .face-mark { stroke: #f8fafc; }
      .orbit-guide { stroke: #cbd5e1; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f8fafc; }
        .subtitle { fill: #94a3b8; }
        .head { fill: #e2e8f0; }
        .face-mark { stroke: #172033; }
        .orbit-guide { stroke: #475569; }
      }
    </style>
  </defs>

  <!-- O: an operating-system orbit carrying a coordinated Agent fleet. -->
  <g transform="translate(28 0)">
    <circle class="orbit-guide" cx="150" cy="160" r="112" fill="none" stroke-width="2" stroke-dasharray="3 10" opacity="0.7"/>
    <circle cx="150" cy="160" r="96" fill="none" stroke="url(#signal)" stroke-width="18" stroke-linecap="round" stroke-dasharray="455 148" transform="rotate(-42 150 160)"/>
    <circle cx="150" cy="160" r="75" fill="none" stroke="url(#signal-reverse)" stroke-width="3" stroke-dasharray="12 9" opacity="0.55"/>

    <!-- Connected nodes on the orbit. -->
    <g fill="#f8fafc" stroke="url(#signal)" stroke-width="6">
      <circle cx="68" cy="93" r="10"/>
      <circle cx="250" cy="152" r="10"/>
      <circle cx="100" cy="247" r="10"/>
    </g>
    <g fill="none" stroke="url(#signal-reverse)" stroke-width="3" opacity="0.75">
      <path d="M76 99 L111 124"/>
      <path d="M240 155 L193 160"/>
      <path d="M106 238 L125 203"/>
    </g>

    <!-- Oryx horns: upward motion also reads as a pair of signal paths. -->
    <g fill="none" stroke="url(#signal)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M125 118 C111 96 98 70 94 36 C113 56 130 83 139 111"/>
      <path d="M175 118 C189 96 202 70 206 36 C187 56 170 83 161 111"/>
    </g>
    <g fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M104 61 L117 57 M110 76 L125 71 M117 92 L132 86"/>
      <path d="M196 61 L183 57 M190 76 L175 71 M183 92 L168 86"/>
    </g>

    <!-- Geometric oryx head: the protected execution kernel. -->
    <path class="head" d="M108 126 L150 103 L192 126 L183 184 L150 216 L117 184 Z"/>
    <path class="head" d="M112 132 L81 119 L96 151 L119 158 Z"/>
    <path class="head" d="M188 132 L219 119 L204 151 L181 158 Z"/>
    <path d="M150 119 L176 138 L169 178 L150 198 L131 178 L124 138 Z" fill="url(#signal)" opacity="0.92"/>
    <path class="face-mark" d="M134 151 L145 156 M166 151 L155 156 M142 181 Q150 187 158 181" fill="none" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="165" r="5" fill="#f8fafc" filter="url(#glow)"/>
  </g>

  <!-- Wordmark. -->
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text class="wordmark" x="340" y="193" font-size="132" font-weight="800" letter-spacing="-7">Oryx</text>
    <text x="688" y="193" font-size="132" font-weight="800" letter-spacing="-7" fill="url(#word-signal)">OS</text>
    <text class="subtitle" x="350" y="244" font-size="23" font-weight="650" letter-spacing="9">AGENT HARNESS OS</text>
  </g>

  <!-- A compact fleet signature balances the wordmark. -->
  <g transform="translate(875 231)" fill="none" stroke="url(#word-signal)" stroke-width="3">
    <path d="M0 0 H106" opacity="0.35"/>
    <circle cx="14" cy="0" r="7" fill="#8b5cf6" stroke="none"/>
    <circle cx="53" cy="0" r="7" fill="#6366f1" stroke="none"/>
    <circle cx="92" cy="0" r="7" fill="#06b6d4" stroke="none"/>
  </g>
</svg>
