<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">OryxOS Agent Harness OS architecture</title>
  <desc id="description">Entry points flow through the OryxOS control plane, execution kernel, shared capabilities, and owned persistence.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#20242b"/></pattern>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25150f"/><stop offset="1" stop-color="#12151b"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow stdDeviation="8" flood-color="#ff6b2c" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#606875"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ff6b2c"/></marker>
    <style>
      .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eye{font-size:11px;font-weight:600;letter-spacing:2px;fill:#737b88}.title{font-size:26px;font-weight:750;fill:#f4f1eb}.label{font-size:13px;font-weight:700;fill:#f4f1eb}.copy{font-size:10px;fill:#8e95a1}
      .orange{fill:#ff6b2c}.mint{fill:#78f7d4}.line{fill:none;stroke:#606875;stroke-width:1.5;marker-end:url(#arrow)}.flow{fill:none;stroke:#ff6b2c;stroke-width:1.8;marker-end:url(#arrowOrange)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="20" fill="#0a0c10"/><rect width="1440" height="900" rx="20" fill="url(#grid)" opacity=".58"/>
  <text x="70" y="58" class="mono eye orange">ORYXOS / SYSTEM MAP / REV. 2026.09</text>
  <text x="70" y="93" class="sans title">One production-grade harness for every agent.</text>
  <circle cx="1344" cy="58" r="6" fill="#78f7d4"/><text x="1325" y="63" text-anchor="end" class="mono eye mint">SELF-HOSTED</text>

  <text x="70" y="146" class="mono eye">TRIGGER SURFACE</text>
  <g>
    <rect x="170" y="166" width="260" height="64" rx="8" fill="#11151b" stroke="#313741"/><text x="194" y="193" class="sans label">CLI / Human</text><text x="194" y="213" class="mono copy">oryxos chat</text><circle cx="401" cy="198" r="5" fill="#78f7d4"/>
    <rect x="590" y="166" width="260" height="64" rx="8" fill="#11151b" stroke="#313741"/><text x="614" y="193" class="sans label">REST / Business systems</text><text x="614" y="213" class="mono copy">POST /api/v1/**</text><circle cx="821" cy="198" r="5" fill="#78f7d4"/>
    <rect x="1010" y="166" width="260" height="64" rx="8" fill="#11151b" stroke="#313741"/><text x="1034" y="193" class="sans label">Scheduler / Channels</text><text x="1034" y="213" class="mono copy">cron · Feishu · WeCom · DingTalk</text><circle cx="1241" cy="198" r="5" fill="#78f7d4"/>
  </g>
  <path d="M300 230V264M720 230V264M1140 230V264" class="line"/>

  <rect x="130" y="266" width="1180" height="482" rx="16" fill="#0d1015" stroke="#ff6b2c" stroke-width="2" filter="url(#glow)"/>
  <rect x="130" y="266" width="1180" height="48" rx="16" fill="#15191f"/><path d="M130 298H1310V314H130Z" fill="#15191f"/>
  <circle cx="158" cy="289" r="6" fill="#ff6b2c"/><text x="177" y="294" class="mono eye orange">ORYXOS BOUNDARY</text><text x="1280" y="294" text-anchor="end" class="mono copy">JDK 21 · SPRING BOOT 3 · ONE EXECUTABLE JAR</text>

  <rect x="22" y="390" width="88" height="150" rx="8" fill="#11151b" stroke="#313741" stroke-dasharray="5 4"/>
  <text x="66" y="412" text-anchor="middle" class="mono eye">LLM</text><text x="66" y="445" text-anchor="middle" class="mono copy">DeepSeek</text><text x="66" y="466" text-anchor="middle" class="mono copy">Qwen</text><text x="66" y="487" text-anchor="middle" class="mono copy">OpenAI</text><text x="66" y="508" text-anchor="middle" class="mono copy">Ollama</text><path d="M110 465H170" class="flow"/>
  <rect x="1330" y="390" width="88" height="150" rx="8" fill="#11151b" stroke="#313741" stroke-dasharray="5 4"/>
  <text x="1374" y="412" text-anchor="middle" class="mono eye">OPEN</text><text x="1374" y="435" text-anchor="middle" class="mono eye">EDGES</text><text x="1374" y="466" text-anchor="middle" class="mono copy">MCP</text><text x="1374" y="487" text-anchor="middle" class="mono copy">Webhook</text><text x="1374" y="508" text-anchor="middle" class="mono copy">A2A</text><path d="M1330 465H1270" class="flow"/>

  <text x="170" y="345" class="mono eye">CONTROL PLANE</text>
  <g>
    <rect x="170" y="362" width="250" height="70" rx="8" fill="#151920" stroke="#323944"/><text x="192" y="391" class="sans label">Agent Registry</text><text x="192" y="414" class="mono copy">one directory = one agent</text>
    <rect x="440" y="362" width="250" height="70" rx="8" fill="#151920" stroke="#323944"/><text x="462" y="391" class="sans label">Lifecycle</text><text x="462" y="414" class="mono copy">load · watch · invoke · archive</text>
    <rect x="710" y="362" width="250" height="70" rx="8" fill="#151920" stroke="#323944"/><text x="732" y="391" class="sans label">Dynamic Registries</text><text x="732" y="414" class="mono copy">provider · notify · skill</text>
    <rect x="980" y="362" width="290" height="70" rx="8" fill="#151920" stroke="#323944"/><text x="1002" y="391" class="sans label">Scheduling &amp; Governance</text><text x="1002" y="414" class="mono copy">cron · policy · human approval</text>
  </g>
  <path d="M720 432V466" class="line"/>

  <rect x="170" y="468" width="1100" height="112" rx="10" fill="url(#kernel)" stroke="#7a3b24"/>
  <text x="192" y="493" class="mono eye orange">EXECUTION KERNEL / FULLY INSPECTABLE</text>
  <g>
    <rect x="192" y="508" width="210" height="50" rx="7" fill="#171a20" stroke="#4a4f58"/><text x="297" y="530" text-anchor="middle" class="sans label">PromptBuilder</text><text x="297" y="547" text-anchor="middle" class="mono copy">context assembly</text>
    <path d="M402 533H443" class="flow"/><rect x="447" y="500" width="280" height="66" rx="8" fill="#ff6b2c"/><text x="587" y="527" text-anchor="middle" class="sans label" style="fill:#090b0e">ReAct Loop</text><text x="587" y="548" text-anchor="middle" class="mono copy" style="fill:#5b210d">REASON → ACT → OBSERVE</text>
    <path d="M727 533H768" class="flow"/><rect x="772" y="508" width="210" height="50" rx="7" fill="#171a20" stroke="#4a4f58"/><text x="877" y="530" text-anchor="middle" class="sans label">ToolExecutor</text><text x="877" y="547" text-anchor="middle" class="mono copy">policy before action</text>
    <path d="M982 533H1023" class="flow"/><rect x="1027" y="508" width="220" height="50" rx="7" fill="#171a20" stroke="#4a4f58"/><text x="1137" y="530" text-anchor="middle" class="sans label">Audit Writer</text><text x="1137" y="547" text-anchor="middle" class="mono copy">every call persisted</text>
  </g>
  <path d="M720 580V612" class="line"/>

  <text x="170" y="625" class="mono eye">SHARED CAPABILITIES / PER-AGENT CONTEXT</text>
  <g>
    <rect x="170" y="642" width="196" height="72" rx="8" fill="#111a19" stroke="#2c6257"/><text x="268" y="670" text-anchor="middle" class="sans label">Provider</text><text x="268" y="693" text-anchor="middle" class="mono copy">explicit model routing</text>
    <rect x="386" y="642" width="196" height="72" rx="8" fill="#111a19" stroke="#2c6257"/><text x="484" y="670" text-anchor="middle" class="sans label">Memory</text><text x="484" y="693" text-anchor="middle" class="mono copy">session · long-term</text>
    <rect x="602" y="642" width="196" height="72" rx="8" fill="#111a19" stroke="#2c6257"/><text x="700" y="670" text-anchor="middle" class="sans label">Knowledge</text><text x="700" y="693" text-anchor="middle" class="mono copy">hybrid retrieval</text>
    <rect x="818" y="642" width="196" height="72" rx="8" fill="#111a19" stroke="#2c6257"/><text x="916" y="670" text-anchor="middle" class="sans label">Tools + MCP</text><text x="916" y="693" text-anchor="middle" class="mono copy">24 built-ins · extensions</text>
    <rect x="1034" y="642" width="236" height="72" rx="8" fill="#111a19" stroke="#2c6257"/><text x="1152" y="670" text-anchor="middle" class="sans label">Sandbox + Notify</text><text x="1152" y="693" text-anchor="middle" class="mono copy">whitelists · outbound channels</text>
  </g>
  <path d="M484 748V780M916 748V780" class="line"/>
  <text x="70" y="817" class="mono eye">STATE / OWNED BY YOU</text>
  <rect x="350" y="782" width="350" height="72" rx="8" fill="#11151b" stroke="#333a44"/><text x="375" y="812" class="sans label">SQLite</text><text x="375" y="835" class="mono copy">sessions · providers · schedules · audit</text>
  <rect x="740" y="782" width="350" height="72" rx="8" fill="#11151b" stroke="#333a44"/><text x="765" y="812" class="sans label">Workspace filesystem</text><text x="765" y="835" class="mono copy">AGENT.md · MEMORY.md · skills · knowledge</text>
  <text x="1370" y="840" text-anchor="end" class="mono eye orange">CONTROL STAYS LOCAL</text>
</svg>
