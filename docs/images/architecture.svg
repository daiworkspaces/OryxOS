<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">OryxOS Architecture</title>
  <desc id="desc">OryxOS architecture showing trigger entry points, agent definitions, the runtime kernel, external integrations, security and persistence.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .section { font: 700 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #475569; }
      .box-title { font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title-light { font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .box-copy { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .small { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .pill { font: 600 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4338ca; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="28" fill="url(#background)"/>

  <text x="80" y="70" class="title">OryxOS Architecture</text>
  <text x="80" y="101" class="subtitle">Java-native enterprise Agent OS · one runtime for models, memory, tools and business agents</text>
  <rect x="1320" y="48" width="200" height="48" rx="24" fill="#ffffff" stroke="#c7d2fe"/>
  <circle cx="1350" cy="72" r="8" fill="#22c55e"/>
  <text x="1370" y="78" class="pill">Private &amp; auditable</text>

  <!-- Trigger entry points -->
  <text x="80" y="158" class="section">TRIGGER ENTRY POINTS</text>
  <g filter="url(#shadow)">
    <rect x="80" y="180" width="250" height="100" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="365" y="180" width="250" height="100" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="650" y="180" width="250" height="100" rx="18" fill="#ffffff" stroke="#dbeafe"/>
  </g>
  <circle cx="120" cy="220" r="20" fill="#dbeafe"/>
  <path d="M110 214h20M110 221h14M110 228h17" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="219" class="box-title">CLI Channel</text>
  <text x="155" y="244" class="box-copy">Interactive chat</text>
  <circle cx="405" cy="220" r="20" fill="#dcfce7"/>
  <path d="M397 212h16v16h-16zM401 208v4M409 228v4M393 216h4M413 224h4" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="440" y="219" class="box-title">REST API</text>
  <text x="440" y="244" class="box-copy">Enterprise integration</text>
  <circle cx="690" cy="220" r="20" fill="#fef3c7"/>
  <circle cx="690" cy="220" r="12" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <path d="M690 212v9l6 4" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="725" y="219" class="box-title">Scheduler</text>
  <text x="725" y="244" class="box-copy">Automatic execution</text>

  <!-- Agent definitions -->
  <text x="980" y="158" class="section">BUSINESS AGENTS</text>
  <g filter="url(#shadow)">
    <rect x="980" y="180" width="540" height="100" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  </g>
  <rect x="1008" y="202" width="74" height="56" rx="10" fill="#ede9fe"/>
  <path d="M1028 214h34M1028 224h34M1028 234h23M1028 244h29" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <text x="1104" y="216" class="box-title">One directory = one Agent</text>
  <text x="1104" y="242" class="box-copy">AGENT.md · skills/ · scripts/ · references</text>
  <text x="1104" y="264" class="small">AgentLoader derives a runtime Profile</text>

  <!-- Connections to runtime -->
  <path d="M205 280 V360" class="flow"/>
  <path d="M490 280 V360" class="flow"/>
  <path d="M775 280 V360" class="flow"/>
  <path d="M1250 280 V360" class="flow"/>

  <!-- Runtime container -->
  <rect x="80" y="360" width="1440" height="420" rx="28" fill="url(#runtime)" stroke="#a5b4fc" stroke-width="2"/>
  <rect x="80" y="360" width="1440" height="66" rx="28" fill="url(#brand)"/>
  <path d="M80 398h1440v28H80z" fill="url(#brand)"/>
  <text x="116" y="402" class="box-title-light">ORYXOS RUNTIME KERNEL</text>
  <text x="1390" y="402" text-anchor="end" class="box-title-light">JDK 21</text>
  <text x="1410" y="402" class="box-title-light">·</text>
  <text x="1430" y="402" class="box-title-light">Spring Boot 3</text>

  <!-- Runtime flow -->
  <g filter="url(#shadow)">
    <rect x="120" y="466" width="240" height="112" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="405" y="466" width="250" height="112" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="700" y="456" width="270" height="132" rx="20" fill="url(#brand)"/>
    <rect x="1015" y="466" width="230" height="112" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="1290" y="466" width="190" height="112" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
  </g>

  <text x="240" y="507" text-anchor="middle" class="box-title">AgentLoader</text>
  <text x="240" y="533" text-anchor="middle" class="box-copy">ProfileRegistry</text>
  <text x="240" y="555" text-anchor="middle" class="small">Load and register agents</text>

  <text x="530" y="507" text-anchor="middle" class="box-title">AgentService</text>
  <text x="530" y="533" text-anchor="middle" class="box-copy">One shared execution entry</text>
  <text x="530" y="555" text-anchor="middle" class="small">Session lifecycle</text>

  <text x="835" y="503" text-anchor="middle" class="box-title-light">ReActLoop</text>
  <text x="835" y="531" text-anchor="middle" class="box-title-light">Reason → Act → Observe</text>
  <rect x="757" y="548" width="156" height="24" rx="12" fill="#ffffff" fill-opacity="0.18"/>
  <text x="835" y="565" text-anchor="middle" class="box-title-light" style="font-size:12px">OryxOS-controlled loop</text>

  <text x="1130" y="507" text-anchor="middle" class="box-title">ProviderService</text>
  <text x="1130" y="533" text-anchor="middle" class="box-copy">Explicit model mapping</text>
  <text x="1130" y="555" text-anchor="middle" class="small">Spring AI adapter</text>

  <text x="1385" y="507" text-anchor="middle" class="box-title">LLM</text>
  <text x="1385" y="533" text-anchor="middle" class="box-copy">Cloud / local</text>
  <text x="1385" y="555" text-anchor="middle" class="small">No vendor lock-in</text>

  <path d="M360 522 H405" class="flow"/>
  <path d="M655 522 H700" class="flow"/>
  <path d="M970 522 H1015" class="flow"/>
  <path d="M1245 522 H1290" class="flow"/>

  <!-- Runtime supporting services -->
  <text x="120" y="622" class="section" style="font-size:13px">SHARED SERVICES USED BY THE EXECUTION LOOP</text>
  <rect x="120" y="640" width="250" height="94" rx="16" fill="#ffffff" stroke="#bae6fd"/>
  <rect x="400" y="640" width="250" height="94" rx="16" fill="#ffffff" stroke="#bbf7d0"/>
  <rect x="680" y="640" width="250" height="94" rx="16" fill="#ffffff" stroke="#fed7aa"/>
  <rect x="960" y="640" width="250" height="94" rx="16" fill="#ffffff" stroke="#fecdd3"/>
  <rect x="1240" y="640" width="240" height="94" rx="16" fill="#ffffff" stroke="#ddd6fe"/>

  <text x="245" y="678" text-anchor="middle" class="box-title">ContextLoader</text>
  <text x="245" y="705" text-anchor="middle" class="box-copy">Prompt · Bootstrap · Skills</text>
  <text x="525" y="678" text-anchor="middle" class="box-title">MemoryService</text>
  <text x="525" y="705" text-anchor="middle" class="box-copy">Session · Long-term</text>
  <text x="805" y="678" text-anchor="middle" class="box-title">ToolExecutor</text>
  <text x="805" y="705" text-anchor="middle" class="box-copy">Validate · Execute · Audit</text>
  <text x="1085" y="678" text-anchor="middle" class="box-title">Sandbox</text>
  <text x="1085" y="705" text-anchor="middle" class="box-copy">Path · Command · Domain</text>
  <text x="1360" y="678" text-anchor="middle" class="box-title">Observability</text>
  <text x="1360" y="705" text-anchor="middle" class="box-copy">Logs · Metrics · Health</text>

  <path d="M930 687 H960" class="flow"/>

  <!-- Bottom layers -->
  <text x="80" y="836" class="section">EXTENSIONS &amp; ENTERPRISE SYSTEMS</text>
  <text x="930" y="836" class="section">STATE &amp; AUDIT</text>

  <g filter="url(#shadow)">
    <rect x="80" y="858" width="790" height="126" rx="20" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="930" y="858" width="590" height="126" rx="20" fill="#ffffff" stroke="#ddd6fe"/>
  </g>

  <rect x="112" y="886" width="210" height="70" rx="14" fill="#eff6ff"/>
  <rect x="340" y="886" width="210" height="70" rx="14" fill="#ecfdf5"/>
  <rect x="568" y="886" width="270" height="70" rx="14" fill="#fff7ed"/>
  <text x="217" y="916" text-anchor="middle" class="box-title">Built-in Tools</text>
  <text x="217" y="940" text-anchor="middle" class="box-copy">File · Shell · HTTP · Notify</text>
  <text x="445" y="916" text-anchor="middle" class="box-title">MCP Servers</text>
  <text x="445" y="940" text-anchor="middle" class="box-copy">Any language</text>
  <text x="703" y="916" text-anchor="middle" class="box-title">Java Tools &amp; Enterprise IT</text>
  <text x="703" y="940" text-anchor="middle" class="box-copy">ERP · CRM · CMDB · Knowledge Base</text>

  <rect x="962" y="886" width="166" height="70" rx="14" fill="#f5f3ff"/>
  <rect x="1142" y="886" width="166" height="70" rx="14" fill="#f5f3ff"/>
  <rect x="1322" y="886" width="166" height="70" rx="14" fill="#f5f3ff"/>
  <text x="1045" y="916" text-anchor="middle" class="box-title">SQLite</text>
  <text x="1045" y="940" text-anchor="middle" class="box-copy">Sessions</text>
  <text x="1225" y="916" text-anchor="middle" class="box-title">Audit</text>
  <text x="1225" y="940" text-anchor="middle" class="box-copy">LLM · Tool calls</text>
  <text x="1405" y="916" text-anchor="middle" class="box-title">Workspace</text>
  <text x="1405" y="940" text-anchor="middle" class="box-copy">MEMORY.md · Agents</text>

  <path d="M805 734 V812 H445 V858" class="flow"/>
  <path d="M525 734 V812 H1045 V858" class="flow"/>
  <path d="M1360 734 V812 H1225 V858" class="flow"/>

  <text x="80" y="1018" class="small">Core principle: every trigger shares one AgentService path; every tool call passes through Sandbox and audit.</text>
  <text x="1520" y="1018" text-anchor="end" class="small">oryxos · architecture v1</text>
</svg>
